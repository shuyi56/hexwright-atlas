<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <span class="eyebrow" id="realmKind">a survey of</span>
      <h1 id="realmName">The Realm</h1>
    </div>
    <form class="seed" id="seedForm" autocomplete="off">
      <label for="seedInput">seed</label>
      <input id="seedInput" name="seed" spellcheck="false" maxlength="40">
      <button type="submit" class="btn">Redraw</button>
      <button type="button" class="btn btn-brass" id="newRealm">New realm</button>
      <button type="button" class="btn" id="openEditor">Tile editor</button>
    </form>
  </header>
  <main class="stage">
    <div class="map-wrap" id="mapWrap">
      <canvas id="map" tabindex="0" role="img" aria-label="Hand-drawn hex map of a fantasy realm. Drag to pan, scroll or pinch to zoom, click a hex to survey it."></canvas>
      <div class="layers">
        <button class="chip" id="lyLabels" aria-pressed="true">Names</button>
        <button class="chip" id="lyNums" aria-pressed="false">Hex numbers</button>
        <button class="chip" id="lyGrid" aria-pressed="true">Grid</button>
      </div>
      <div class="zoom">
        <button class="btn" id="zIn" aria-label="Zoom in">+</button>
        <button class="btn" id="zOut" aria-label="Zoom out">−</button>
        <button class="btn fit" id="zFit" aria-label="Fit whole map">fit</button>
      </div>
      <div class="tip" id="tip" hidden></div>
      <div class="veil" id="veil">Surveying the realm…</div>
      <div class="city" id="city" hidden>
        <canvas id="cityCanvas" tabindex="0" role="img" aria-label="Isometric district map of the city. Drag to pan, scroll or pinch to zoom, click a district to survey it."></canvas>
        <div class="city-bar">
          <button class="btn" id="cityBack">← Realm map</button>
          <div class="city-title"><span class="eyebrow" id="cityKind">city</span><strong id="cityName">City</strong></div>
          <div class="city-tools">
            <button class="chip" id="cityRotL" aria-label="Rotate view left">⟲ Turn</button>
            <button class="chip" id="cityRotR" aria-label="Rotate view right">Turn ⟳</button>
            <button class="chip" id="cityLabels" aria-pressed="true">Names</button>
          </div>
        </div>
        <div class="zoom">
          <button class="btn" id="cIn" aria-label="Zoom in">+</button>
          <button class="btn" id="cOut" aria-label="Zoom out">−</button>
          <button class="btn fit" id="cFit" aria-label="Fit whole city">fit</button>
        </div>
        <div class="tip" id="cityTip" hidden></div>
        <div class="veil" id="cityVeil" hidden>Drawing the city…</div>
      </div>
    </div>
    <aside class="ledger" aria-label="Survey ledger">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-survey" aria-selected="true" aria-controls="pane-survey">Survey</button>
        <button class="tab" role="tab" id="tab-places" aria-selected="false" aria-controls="pane-places">Places</button>
        <button class="tab" role="tab" id="tab-key" aria-selected="false" aria-controls="pane-key">Key</button>
      </div>
      <section class="pane" id="pane-survey" role="tabpanel" aria-labelledby="tab-survey"></section>
      <section class="pane" id="pane-places" role="tabpanel" aria-labelledby="tab-places" hidden></section>
      <section class="pane" id="pane-key" role="tabpanel" aria-labelledby="tab-key" hidden></section>
    </aside>
  </main>
</div>
<div class="editor" id="editor" hidden tabindex="-1" aria-label="Isometric tile editor">
  <header class="ed-bar">
    <button class="btn" id="edBack">← Atlas</button>
    <div class="ed-title"><span class="eyebrow">tile editor</span><input id="edName" maxlength="60" spellcheck="false" aria-label="Map name"></div>
    <div class="ed-actions">
      <label class="ed-field"><span>size</span><select id="edSize"><option>16</option><option>24</option><option>28</option><option>32</option><option>48</option><option>60</option></select></label>
      <label class="ed-field"><span>land</span><select id="edBiome"></select></label>
      <button class="btn btn-brass" id="edGen">Generate</button>
      <button class="btn" id="edNew">Blank</button>
      <span class="ed-sep" aria-hidden="true"></span>
      <button class="btn" id="edUndo" title="Undo (Ctrl+Z)">Undo</button>
      <button class="btn" id="edRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <span class="ed-sep" aria-hidden="true"></span>
      <button class="btn" id="edPng">PNG</button>
      <button class="btn" id="edSave">Save</button>
      <button class="btn" id="edLoad">Open…</button>
      <input type="file" id="edFile" accept=".json,application/json" hidden>
    </div>
  </header>
  <div class="ed-body">
    <div class="ed-stage" id="edStage">
      <canvas id="edCanvas" tabindex="0" role="img" aria-label="Isometric tile map. Click or drag to apply the current tool; right-drag or space-drag to pan; scroll to zoom."></canvas>
      <canvas id="edOverlay" aria-hidden="true"></canvas>
      <div class="ed-view">
        <button class="chip" id="edRotL" title="Turn view ([)">⟲ Turn</button>
        <button class="chip" id="edRotR" title="Turn view (])">Turn ⟳</button>
        <button class="chip" id="edGrid" aria-pressed="true">Grid</button>
      </div>
      <div class="zoom">
        <button class="btn" id="edIn" aria-label="Zoom in">+</button>
        <button class="btn" id="edOut" aria-label="Zoom out">−</button>
        <button class="btn fit" id="edFit" aria-label="Fit whole map">fit</button>
      </div>
      <div class="ed-foot">
        <div class="ed-levels" role="group" aria-label="Storey (PgUp / PgDn)" title="Storey to work on; the floors above it are hidden (PgUp / PgDn)">
          <span class="ed-lbl">floor</span>
          <button class="chip" data-level="3" aria-pressed="false" title="Floor 3 (PgUp / PgDn)">3</button>
          <button class="chip" data-level="2" aria-pressed="false" title="Floor 2 (PgUp / PgDn)">2</button>
          <button class="chip" data-level="1" aria-pressed="false" title="Floor 1 (PgUp / PgDn)">1</button>
          <button class="chip" data-level="0" aria-pressed="true" title="Ground floor (PgUp / PgDn)">G</button>
        </div>
        <div class="ed-status" id="edStatus" aria-live="polite"></div>
      </div>
    </div>
    <aside class="ed-palette" aria-label="Tile palette">
      <div class="ed-tools" id="edTools" role="toolbar" aria-label="Tools"></div>
      <div class="ed-row">
        <span class="ed-lbl">brush</span>
        <button class="chip" data-brush="1">1</button><button class="chip" data-brush="2">2</button><button class="chip" data-brush="3">3</button>
        <button class="chip ed-face" id="edFace" title="Turn the piece (R)">Facing</button>
      </div>
      <div class="tabs" id="edTabs" role="tablist"></div>
      <div class="ed-items" id="edItems"></div>
    </aside>
  </div>
</div>
<div class="editor char-maker" id="charMaker" hidden tabindex="-1" aria-label="Character maker">
  <header class="ed-bar">
    <button class="btn" id="cmBack">← Tile editor</button>
    <div class="ed-title"><span class="eyebrow">character maker</span><input id="cmName" maxlength="40" spellcheck="false" aria-label="Character name"></div>
    <div class="ed-actions">
      <label class="ed-field"><span>start from</span><select id="cmFrom" aria-label="Start from"></select></label>
      <span class="ed-sep" aria-hidden="true"></span>
      <button class="btn" id="cmUndo" title="Undo (Ctrl+Z)">Undo</button>
      <button class="btn" id="cmRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <span class="ed-sep" aria-hidden="true"></span>
      <button class="btn" id="cmCopy">Duplicate</button>
      <button class="btn" id="cmDelete">Delete</button>
      <button class="btn btn-brass" id="cmDone">Done</button>
    </div>
  </header>
  <div class="ed-body">
    <div class="ed-stage cm-stage">
      <canvas id="cmPreview" role="img" aria-label="The character in all four facings"></canvas>
      <div class="ed-view"><button class="chip" id="cmWalk" aria-pressed="true" title="Walk in place, or stand">Walking</button></div>
      <div class="ed-status" id="cmStatus" aria-live="polite">Changes save to your character library as you go.</div>
    </div>
    <aside class="ed-palette" aria-label="Choices"><div class="ed-items cm-choices" id="cmChoices"></div></aside>

  + '.scene-panel button{font:inherit;font-size:12px;color:#efe6cf;background:#2a2e2a;border:1px solid #4a4a3c;border-radius:12px;padding:3px 10px;cursor:pointer}.scene-panel button:hover{border-color:#e4c684}'
  + '.scene-panel .sum{padding:8px 12px 4px;color:#cfc4a8}.scene-panel .sum b{color:#efe6cf}.scene-panel .about{padding:0 12px 8px;color:#a59c86;font-size:12px}'
  + '.scene-panel ol{list-style:none;margin:0;padding:0 6px 8px}.scene-panel li{padding:7px 8px;border-radius:4px;cursor:pointer;display:grid;grid-template-columns:18px 1fr;gap:2px 6px}.scene-panel li:hover{background:#262b28}'
  + '.scene-panel .mark{font-weight:700}.scene-panel .ok .mark{color:#9fc27a}.scene-panel .bad .mark{color:#e07a5f}.scene-panel .run .mark{color:#a59c86}'
  + '.scene-panel .detail{grid-column:2;color:#a59c86;font-size:12px}.scene-panel .bad .detail{color:#e0a08a}.scene-panel.min ol,.scene-panel.min .about{display:none}';
document.head.appendChild(css);
const panel = document.createElement('section'); panel.className = 'scene-panel'; panel.setAttribute('aria-label', 'Scene checks');
panel.innerHTML = '<header><h2></h2><button data-a="rerun" title="Run every check again">Re-run</button><button data-a="min" title="Fold the list">–</button></header><div class="sum"></div><div class="about"></div><ol></ol>';
panel.querySelector('h2').textContent = S.title; panel.querySelector('.about').textContent = S.about + (S.checks.length ? ' Click a check to watch that walk.' : '');
document.body.appendChild(panel);
const list = panel.querySelector('ol'), sum = panel.querySelector('.sum');
panel.querySelector('[data-a=min]').onclick = () => panel.classList.toggle('min');
panel.querySelector('[data-a=rerun]').onclick = () => runAll();

/* ---------- running a check ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
function sceneFor(c) {
  const m = clone(S.map);
  if (c.start) { const ch = m.characters.find(x => x.sprite === c.who); Object.assign(ch, { x: c.start.x, y: c.start.y }); if (c.start.level) ch.level = c.start.level; else delete ch.level; }
  return m;
}
/* every step one tile and at most one height level; storeys change only on or off a flight of stairs */
function audit(m, start, route) {
  const N = m.size, el = (x, y) => m.elevation[y * N + x], stairs = new Set(m.objects.filter(o => o.id === 'stairs').map(o => o.x + ',' + o.y + ',' + (o.level || 0)));
  let prev = start; const bad = [], storeys = [];
  for (const p of route) {
    if (Math.abs(p[0] - prev[0]) + Math.abs(p[1] - prev[1]) !== 1) bad.push('jumped ' + prev + ' -> ' + p);
    const climb = Math.abs(el(p[0], p[1]) - el(prev[0], prev[1])); if (climb > 1) bad.push('climbed ' + climb + ' levels at ' + prev + ' -> ' + p);
    if (p[2] !== prev[2]) { storeys.push(prev[2] + '->' + p[2]); const foot = p[2] > prev[2] ? prev : p; if (!stairs.has(foot.join(','))) bad.push('changed storey off the stairs at ' + prev + ' -> ' + p); }
    prev = p;
  }
  return { bad, storeys, heights: [start, ...route].map(p => el(p[0], p[1])).join('') };
}
async function runOne(c) {
  await h.call('setMap', { map: sceneFor(c) });
  if (c.edits) await h.call('batch', { ops: c.edits });
  const m = await h.call('getMap'), list = (await h.call('listCharacters')).characters, who = list.find(x => x.sprite === c.who);
  if (!who) return { pass: false, detail: 'no character ' + c.who + ' in the scene' };
  const start = [who.x, who.y, who.level], r = await h.call('walkCharacter', { index: who.index, to: c.to });
  if (c.expect === 'blocked') return r.walked ? { pass: false, detail: 'expected no route, but walked ' + r.steps + ' steps' } : { pass: true, detail: r.reason };
  if (!r.walked) return { pass: false, detail: 'expected a route: ' + r.reason };
  const a = audit(m, start, r.route), fails = [...a.bad];
  if (c.storeys && a.storeys.join(' ') !== c.storeys.join(' ')) fails.push('storeys ' + (a.storeys.join(', ') || 'none') + ', expected ' + c.storeys.join(', '));
  if (c.heights && a.heights !== c.heights) fails.push('heights ' + a.heights + ', expected ' + c.heights);
  if (c.minSteps && r.steps < c.minSteps) fails.push(r.steps + ' steps, expected at least ' + c.minSteps);
  for (const [x, y] of c.via || []) if (!r.route.some(p => p[0] === x && p[1] === y)) fails.push('did not pass ' + x + ',' + y);
  const route = r.steps + ' steps · heights ' + a.heights + (a.storeys.length ? ' · storeys ' + a.storeys.join(', ') : '');
  return fails.length ? { pass: false, detail: fails.join('; ') + ' (' + route + ')' } : { pass: true, detail: route };
}
async function runAll() {
  list.textContent = ''; sum.textContent = 'Running…';
  const results = [];
  for (const c of S.checks) {
    let r; try { r = await runOne(c); } catch (e) { r = { pass: false, detail: 'error: ' + e.message }; }
    results.push({ name: c.name, ...r });
    const li = document.createElement('li'); li.className = r.pass ? 'ok' : 'bad'; li.title = 'Watch this walk';
    li.innerHTML = '<span class="mark"></span><span class="name"></span><span class="detail"></span>';
    li.querySelector('.mark').textContent = r.pass ? '✓' : '✗'; li.querySelector('.name').textContent = c.name; li.querySelector('.detail').textContent = r.detail;
    li.onclick = () => watch(c); list.appendChild(li);
  }
  const passed = results.filter(r => r.pass).length;
  sum.innerHTML = ''; const b = document.createElement('b'); b.textContent = passed + ' of ' + results.length + ' checks passed'; sum.appendChild(b);
  window.__sceneResults = { passed, total: results.length, results };
  await show(S.map);
  return window.__sceneResults;
}
/* back to the scene as saved, the editor open on it */
async function show(m, level = 0) {
  await h.call('open'); await h.call('setMap', { map: clone(m) });
  await h.call('setView', { level, fit: true, grid: false });
}
/* replay one check on screen: the view follows to the storey the walk ends on */
async function watch(c) {
  const m = sceneFor(c); await show(m, c.start ? c.start.level || 0 : 0);
  if (c.edits) await h.call('batch', { ops: c.edits });
  const who = (await h.call('listCharacters')).characters.find(x => x.sprite === c.who); if (!who) return;
  await h.call('setView', { level: Math.max(c.to.level || 0, who.level || 0) });
  await h.call('walkCharacter', { index: who.index, to: c.to });
}
window.__sceneRun = runAll;
if (S.checks.length) await runAll(); else { sum.textContent = 'No checks for this scene.'; await show(S.map); }

</script>
