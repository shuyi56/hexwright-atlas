<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skills · Hexwright</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
</head>
<body>
<div class="ub sk">
  <header class="ub-bar">
    <div class="ub-title"><span class="eyebrow">skill data</span><h1>Skills &amp; effects</h1></div>
    <div class="ub-actions">
      <span class="ub-mode" id="mode"></span>
      <button class="btn" id="newSkill">New skill…</button>
      <button class="btn" id="download" title="Download the selected skill's JSON file">Download</button>
      <button class="btn" id="revertAll">Revert all</button>
      <button class="btn btn-brass" id="saveAll" title="Save every changed skill (Ctrl+S)">Save</button>
    </div>
  </header>
  <main class="ub-main" id="main">
    <aside class="ub-list" aria-label="Skills">
      <input class="ub-search" id="search" type="search" placeholder="Filter by name or id" aria-label="Filter skills" spellcheck="false" autocomplete="off">
      <div class="ub-rows" id="rows"></div>
    </aside>
    <section class="ub-detail" id="detail" aria-live="polite"></section>
  </main>
  <div class="ub-toast" id="toast" role="status" hidden></div>
</div>
<dialog class="ub-dialog" id="newDialog">
  <form method="dialog" id="newForm">
    <h2>New skill</h2>
    <label class="ub-field"><span>id (the file's name, and what unit data names)</span><input id="newId" required pattern="[a-z0-9][a-z0-9\-]{0,47}" maxlength="48" spellcheck="false" autocomplete="off" placeholder="fireball"></label>
    <label class="ub-field"><span>name</span><input id="newLabel" maxlength="32" spellcheck="false" autocomplete="off" placeholder="Fireball"></label>
    <label class="ub-field"><span>start from</span><select id="newFrom"></select></label>
    <div class="ub-dialog-actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn btn-brass" value="ok" id="newOk">Create</button></div>
  </form>
</dialog>
<script type="module" src="/src/skills/main.js"></script>
</body>
</html>
